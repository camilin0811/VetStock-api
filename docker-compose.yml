# Solo la base de datos:       docker compose up -d
# Con pgAdmin:                 docker compose --profile pgadmin up -d
# Todo (postgres, pgadmin, api): docker compose --profile full up -d --build
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vetstock_db}
      POSTGRES_USER: ${POSTGRES_USER:-vetstock_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetstock_password}
    ports:
      # Puerto del host configurable. Si el 5432 ya esta ocupado (otro PostgreSQL
      # instalado en el equipo), define POSTGRES_PORT=55432 en .env y vuelve a
      # levantar con docker compose up -d. La API local lee el mismo valor de .env.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: ["pgadmin", "full"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@vetstock.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full"]
    build: .
    env_file:
      - .env
    environment:
      # Dentro de la red de compose la BD es el servicio "postgres", no localhost
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
